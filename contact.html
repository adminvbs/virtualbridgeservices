<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Contact Us - Virtual Bridge Services</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="css/styles.css" rel="stylesheet" />
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
    <div class="container">
        <a class="navbar-brand" href="index.html">VIRTUAL BRIDGE SERVICES</a>
    </div>
</nav>

<!-- HERO -->
<header style="padding: 150px 0 80px; background: #0d1b2a; color: white; text-align: center;">
    <div class="container">
        <h1>Let’s Build Your Remote Team</h1>
        <p style="font-size: 20px; max-width: 700px; margin: auto;">
            Book a quick call with us to understand your needs and find the right talent for your business.
        </p>
    </div>
</header>

<!-- CONTENT -->
<section style="padding: 60px 0;">
    <div class="container text-center">

        <h3 style="margin-bottom: 30px;">Book a Meeting Now</h3>
<form action="https://api.web3forms.com/submit" method="POST" style="max-width: 600px; margin: auto; text-align: left;">

    <!-- Access Key -->
    <input type="hidden" name="access_key" value="60e3543e-1274-4a1d-8fa4-84ae679d3f3d">

    <!-- Name -->
    <label>First Name</label>
    <input type="text" name="first_name" required style="width: 100%; padding: 10px; margin-bottom: 15px;">

    <label>Last Name</label>
    <input type="text" name="last_name" required style="width: 100%; padding: 10px; margin-bottom: 15px;">

    <!-- Email -->
    <label>Email</label>
    <input type="email" name="email" required style="width: 100%; padding: 10px; margin-bottom: 15px;">

    <!-- Company -->
    <label>Company Name</label>
    <input type="text" name="company" style="width: 100%; padding: 10px; margin-bottom: 15px;">

    <!-- Message -->
    <label>Tell us what you need</label>
    <textarea name="message" required rows="5" style="width: 100%; padding: 10px; margin-bottom: 20px;"></textarea>

    <!-- Submit -->
    <button type="submit" style="width: 100%; padding: 15px; background: #007bff; color: white; font-weight: bold; border: none; border-radius: 5px;">
        Submit Inquiry
    </button>

</form>

        <p style="margin-top: 30px; color: #666;">
            Prefer email? You can still reach us directly.
        </p>

        <!-- Optional Email -->
        <p><strong>admin@virtualbridgeservices.com</strong></p>

    </div>
</section>

</body>
</html>
